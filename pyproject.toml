[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finrag"
version = "0.1.0"
description = "RAG assistant for Canadian annual reports, with citations and evaluation"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24",
    "chromadb>=0.5",
    "ollama>=0.4",
    "tqdm>=4.66",
]

[tool.setuptools.packages.find]
where = ["src"]
